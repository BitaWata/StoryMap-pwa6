<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/StoryMap-pwa5/images/favicon.png" />
    <title>Story Map</title>


    <link rel="manifest" href="/StoryMap-pwa5/manifest.json" />
    <meta name="theme-color" content="#4A90E2" />

    <link rel="icon" href="/StoryMap-pwa5/images/favicon.png" type="image/png" />
    <script type="module" crossorigin src="/StoryMap-pwa5/assets/main-NOnWCQmP.js"></script>
    <link rel="stylesheet" crossorigin href="/StoryMap-pwa5/assets/main-Ck-I-EMG.css">
  <link rel="manifest" href="/StoryMap-pwa5/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/StoryMap-pwa5/registerSW.js"></script></head>

  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header role="banner">
      <div class="main-header container">
        <a class="brand-name" href="#/" aria-label="Kembali ke halaman utama">
          <img src="/StoryMap-pwa5/images/favicon.png" alt="Story Map Logo" class="brand-logo" />
          Story Map
        </a>

        <nav id="navigation-drawer" class="navigation-drawer">
          <ul id="nav-list" class="nav-list">
            <li><a href="#/">Beranda</a></li>
            <li><a href="#/add">Tambah Story</a></li>
            <li><a href="#" id="logout-link">Logout</a></li>
            <li><a href="#/bookmark">Favorit</a></li>
          </ul>
        </nav>

        <button id="drawer-button" class="drawer-button">☰</button>
      </div>
    </header>

    <main id="main-content" class="main-content" tabindex="-1"></main>

    <footer>
      <div class="container footer-content">
        <p>© 2025 StoryMap by Tabita Ayutari Wata</p>
      </div>
    </footer>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => console.log('✅ Service Worker registered:', reg.scope))
            .catch((err) => console.error('❌ SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
